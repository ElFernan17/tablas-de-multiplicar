<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabla del 3</title>
  <link rel="stylesheet" href="multiplicar.css">
</head>
<body>
  <div class="barra">
    <button type="button" class="boton" onclick="generarTablas();">PROBAR</button>
  </div>

  <div class="contenedor">
    <h1>Tabla del 3</h1>
    <div class="leyenda">Multiplicaciones del 3 del 1 al 10</div>

    <div class="tabla" id="idContenedor">
      <div class="fila">3 × 1 = 3</div>
      <div class="fila">3 × 2 = 6</div>
      <div class="fila">3 × 3 = 9</div>
      <div class="fila">3 × 4 = 12</div>
      <div class="fila">3 × 5 = 15</div>
      <div class="fila">3 × 6 = 18</div>
      <div class="fila">3 × 7 = 21</div>
      <div class="fila">3 × 8 = 24</div>
      <div class="fila">3 × 9 = 27</div>
      <div class="fila">3 × 10 = 30</div>
    </div>
  </div>

  <div class="pie">
    <p>Creado por <strong>Fernando Silva</strong></p>
  </div>
</body>
<script src="multiplicar.js"></script>
</html>
