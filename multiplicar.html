<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabla del 3</title>
  <link rel="stylesheet" href="multiplicar.css">
</head>
<body>
  <header class="barra">
    <button type="button" class="boton">PROBAR</button>
  </header>

  <main class="contenedor">
    <h1>Tabla del 3</h1>

    <table>
      <caption>Multiplicaciones del 3 del 1 al 10</caption>
      <thead>
        <tr>
          <th scope="col">Operación</th>
          <th scope="col">Resultado</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>3 × 1</td><td>3</td></tr>
        <tr><td>3 × 2</td><td>6</td></tr>
        <tr><td>3 × 3</td><td>9</td></tr>
        <tr><td>3 × 4</td><td>12</td></tr>
        <tr><td>3 × 5</td><td>15</td></tr>
        <tr><td>3 × 6</td><td>18</td></tr>
        <tr><td>3 × 7</td><td>21</td></tr>
        <tr><td>3 × 8</td><td>24</td></tr>
        <tr><td>3 × 9</td><td>27</td></tr>
        <tr><td>3 × 10</td><td>30</td></tr>
      </tbody>
    </table>
  </main>

  <footer class="pie">
    <p>Creado por <strong>Fernando Silva</strong></p>
  </footer>
</body>
</html>
